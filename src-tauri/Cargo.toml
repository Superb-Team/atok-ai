[package]
name = "atok-ai"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "atok_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
swift-rs = { version = "1.0", features = ["build"] }

[features]
default = ["aec"]
aec = ["dep:webrtc-audio-processing"]

[dependencies]
tauri = { version = "=2.11.5", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-dialog = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
argon2 = "0.5"
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
thiserror = "2"
lazy_static = "1.5.0"
reqwest = { version = "0.12", features = ["json", "multipart"] }
base64 = "0.22"
dotenvy = "0.15.7"
mp3lame-encoder = "0.2"
nnnoiseless = { version = "0.5", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ringbuf = "0.4"
webrtc-audio-processing = { version = "~0.5", features = ["bundled"], optional = true }
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "wav", "flac"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = "0.15"
# Native PulseAudio/PipeWire client so the app needs no external CLI tools
# (parec/pactl). libpulse.so.0 is present wherever the audio server runs.
libpulse-binding = "2"
libpulse-simple-binding = "2"
# XDG desktop portal (D-Bus) for screenshots — works on Wayland and X11 with no
# external CLI tools, matching the repo's zero-subprocess posture.
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.15"
swift-rs = "1.0"
